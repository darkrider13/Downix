name: Build and Release

# Every push to the main branch builds a signed APK and publishes it as a GitHub Release.
# The app's update checker reads the latest release, so a new build shows up inside Downix.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "branding/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing. See README.md (Signing key)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore signing key
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/downix-release.jks"
          echo "DOWNIX_KEYSTORE_PATH=$RUNNER_TEMP/downix-release.jks" >> "$GITHUB_ENV"
          echo "DOWNIX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DOWNIX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DOWNIX_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Work out the version
        id: version
        run: |
          base=$(grep '^downix.versionBase=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: >
          gradle :app:assembleRelease --no-daemon --stacktrace
          -PbuildNumber=${{ github.run_number }}
          -PupdateRepo=${{ github.repository }}

      - name: Name the APK and check its signature
        id: apk
        run: |
          src=$(find app/build/outputs -name '*.apk' 2>/dev/null | head -n 1 || true)
          if [ -z "$src" ]; then
            echo "::error::No release APK was built. Files found in app/build/outputs:"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK found: $src"
          out="Downix-${{ steps.version.outputs.name }}.apk"
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$signer" ]; then
            "$signer" verify --print-certs "$out" || echo "::warning::apksigner could not verify the APK"
          else
            echo "apksigner not found, signature check skipped"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          notes="${COMMIT_MESSAGE:-Manual build}"
          gh release create "v${{ steps.version.outputs.name }}" "${{ steps.apk.outputs.file }}" \
            --title "Downix ${{ steps.version.outputs.name }}" \
            --notes "$notes" \
            --target "${{ github.sha }}" \
            --latest
