org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- Downix release settings ---
# Base of the version number: the final version is <base>.<build number>, e.g. 1.0.12. Raise it (1.1, 2.0) for big releases.
downix.versionBase=1.0
# GitHub "owner/repo" for the in-app update checker. GitHub Actions fills this automatically; only set it for local builds.
downix.updateRepo=
