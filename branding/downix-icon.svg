<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Downix">
  <title>Downix</title>
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="492" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#3D3D3D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="url(#bg)"/>

  <!-- soft ring shadow -->
  <circle cx="256" cy="256" r="149.8" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="31.94" filter="url(#soft)"/>
  <!-- black disc -->
  <circle cx="256" cy="256" r="149.8" fill="#000"/>
  <!-- ring: faint track + white progress -->
  <path d="M 256,106.2 A 149.8 149.8 0 0 0 113.11,304.4" fill="none" stroke="#FFF" stroke-opacity="0.18" stroke-width="19.36" stroke-linecap="round"/>
  <path d="M 256,106.2 A 149.8 149.8 0 1 1 113.11,304.4" fill="none" stroke="#FFF" stroke-width="19.36" stroke-linecap="round"/>
  <circle cx="113.11" cy="304.4" r="23.05" fill="#FFF"/>
  <!-- arrow -->
  <path d="M 256,208.98 L 256,285.04" fill="none" stroke="#FFF" stroke-width="23.05" stroke-linecap="round"/>
  <path d="M 221.89,259.69 L 256,293.8 L 290.11,259.69" fill="none" stroke="#FFF" stroke-width="23.05" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
